<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <!-- Icons: SVG first (modern browsers pick it), PNG fallbacks below for
         engines that ignore SVG favicons. Same mark as public/favicon.svg. -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>DSH Native Mobile Remote</title>
    <meta name="description" content="Native mobile companion client for DeepSeek Harness (DSH). Remote execution, session management, real-time tool tracking, and desktop device pairing." />
    <meta property="og:title" content="DSH Native Mobile Remote" />
    <meta property="og:description" content="Native mobile companion client for DeepSeek Harness (DSH). Remote execution, session management, real-time tool tracking, and desktop device pairing." />
    <!-- Apple Touch settings for mobile feel -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="DSH Remote" />
    <!-- Light-only UI, so keep the browser chrome light. The brand blue
         lives in the manifest's theme_color for the install/splash surface. -->
    <meta name="theme-color" content="#ffffff" />
  </head>
  <body class="bg-[#f5f5f5] text-[#151517] antialiased selection:bg-[#c4e7ff] selection:text-[#004b96]">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
