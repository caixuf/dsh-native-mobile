<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" viewBox="0 0 100 100" role="img" aria-label="DSH Native Mobile Remote">
  <!--
    DSH Native Mobile Remote - web favicon.
    A bold white terminal prompt "> _" on a brand-blue field: a phone-sized
    remote control driving a desktop session.

    Same visual language as the Android launcher icon
    (apps/android/app/src/main/res/drawable/ic_launcher_foreground.xml),
    same geometry as public/favicon-16x16.png ... 512x512.png.

    Geometry below is in a 0..100 user space; the chevron uses three
    round-capped, round-joined points so it survives down to 16x16 without
    turning into mush.
  -->
  <defs>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5B81FF"/>
      <stop offset="0.45" stop-color="#3964FE"/>
      <stop offset="1" stop-color="#2B4EC9"/>
    </linearGradient>
  </defs>

  <rect width="100" height="100" rx="22" fill="url(#brand)"/>

  <!-- chevron ">" : solid-looking at 16px, still crisp at 512px -->
  <path d="M27.8 33 L45.8 50 L27.8 67"
        fill="none" stroke="#fff" stroke-width="11"
        stroke-linecap="round" stroke-linejoin="round"/>

  <!-- cursor "_" : stadium-shaped so it still reads as a bar at 16px -->
  <rect x="53.8" y="61.5" width="24" height="11" rx="5.5" fill="#fff"/>
</svg>
